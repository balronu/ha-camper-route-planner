calculate_route:
  name: Calculate route
  description: Calculate one route explicitly. No automatic or periodic calculation is performed.
  fields:
    entry_id:
      name: Config entry ID
      description: The Camper Route Planner config entry to use.
      required: true
      selector:
        text:
    profile_id:
      name: Vehicle profile ID
      description: Stable vehicle profile identifier.
      required: true
      selector:
        text:
    origin:
      name: Origin
      description: Object with latitude, longitude and optional label.
      required: true
      selector:
        object:
    destination:
      name: Destination
      description: Object with latitude, longitude and optional label.
      required: true
      selector:
        object:
    via:
      name: Waypoints
      description: Optional ordered list of waypoint objects.
      required: false
      selector:
        object:
    route_name:
      name: Route name
      required: false
      selector:
        text:
    traffic:
      name: Traffic mode
      description: off, live or forecast; applied only when the route is explicitly calculated.
      required: false
      selector:
        select:
          options: ["off", "live", "forecast"]
    alternatives:
      name: Alternative routes
      description: Up to two alternatives, only without waypoints.
      required: false
      selector:
        number:
          min: 0
          max: 2
          mode: box
    avoid:
      name: Avoidances
      required: false
      selector:
        select:
          multiple: true
          options: ["tolls", "motorways", "ferries", "tunnels"]
    route_type:
      name: Route type
      required: false
      selector:
        select:
          options: ["fastest", "eco"]
    depart_at:
      name: Planned departure
      required: false
      selector:
        text:
    arrive_at:
      name: Planned arrival
      required: false
      selector:
        text:
