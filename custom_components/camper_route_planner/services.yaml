calculate_route:
  name: Calculate route
  description: Calculate one route explicitly. No automatic or periodic calculation is performed.
  fields:
    entry_id:
      name: Config entry ID
      description: The Camper Route Planner config entry to use.
      required: true
      selector:
        text:
    profile_id:
      name: Vehicle profile ID
      description: Stable vehicle profile identifier.
      required: true
      selector:
        text:
    origin:
      name: Origin
      description: Object with latitude, longitude and optional label.
      required: true
      selector:
        object:
    destination:
      name: Destination
      description: Object with latitude, longitude and optional label.
      required: true
      selector:
        object:
    via:
      name: Waypoints
      description: Optional ordered list of waypoint objects.
      required: false
      selector:
        object:
    route_name:
      name: Route name
      required: false
      selector:
        text:
    traffic:
      name: Traffic mode
      description: off, live or forecast; applied only when the route is explicitly calculated.
      required: false
      selector:
        select:
          options: ["off", "live", "forecast"]
    alternatives:
      name: Alternative routes
      description: Up to two alternatives, only without waypoints.
      required: false
      selector:
        number:
          min: 0
          max: 2
          mode: box
    avoid:
      name: Avoidances
      required: false
      selector:
        select:
          multiple: true
          options: ["tolls", "motorways", "ferries", "tunnels"]
    route_type:
      name: Route type
      required: false
      selector:
        select:
          options: ["fastest", "eco"]
    depart_at:
      name: Planned departure
      required: false
      selector:
        text:
    arrive_at:
      name: Planned arrival
      required: false
      selector:
        text:
    poi_parking:
      name: Show parking POIs
      description: Include documented parking POIs in the same deliberate route request.
      required: false
      default: false
      selector:
        boolean:
    poi_fuel:
      name: Show fuel POIs
      description: Include documented diesel fuel POIs in the same deliberate route request.
      required: false
      default: false
      selector:
        boolean:
    poi_fuel_type:
      name: POI fuel type
      required: false
      default: diesel
      selector:
        select:
          options: [diesel]
    fuel_plan_enabled:
      name: Enable intelligent fuel planning
      description: Request the optional NaKordoni v3 fuel plan for this deliberate calculation.
      required: false
      default: false
      selector:
        boolean:
    fuel_plan_tank_l:
      name: Fuel-plan tank capacity
      description: Usable tank capacity in litres; required only when intelligent fuel planning is enabled.
      required: false
      selector:
        number:
          min: 20
          max: 1500
          step: 0.1
          mode: box
    fuel_plan_consumption_l100:
      name: Fuel-plan consumption
      description: Consumption in litres per 100 km; required only when intelligent fuel planning is enabled.
      required: false
      selector:
        number:
          min: 3
          max: 60
          step: 0.1
          mode: box
    fuel_plan_start_fuel_pct:
      name: Fuel-plan starting level
      description: Starting fuel level in percent.
      required: false
      default: 100
      selector:
        number:
          min: 5
          max: 100
          step: 0.1
          mode: box
    fuel_plan_reserve_pct:
      name: Fuel-plan reserve
      description: Minimum reserve in percent.
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 50
          step: 0.1
          mode: box
